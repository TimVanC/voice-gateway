name: RSE Ava Daily Check

# BACKUP ONLY. The on-time 8 AM and 4 PM Eastern reports are sent by the Railway
# server itself (src/monitor/schedule.js). GitHub's cron has been starting this
# repo's scheduled runs 3-9 hours late every day, so this job exists to catch the
# one thing the server cannot report on: the server being down. Scheduled runs
# email only when something fails, so a healthy day is silent; a manual
# "Run workflow" always emails the full report, which is how to test the email path.

on:
  schedule:
    # Targets: 8:00 AM and 4:00 PM America/New_York. GitHub cron is UTC-only, so
    # both candidate UTC hours are scheduled for each and the DST guard step
    # picks the right one:
    #   12:03 / 20:03 UTC = 8:03 AM / 4:03 PM EDT (Mar-Nov)
    #   13:03 / 21:03 UTC = 8:03 AM / 4:03 PM EST (Nov-Mar)
    # Minute 3 instead of 0 because top-of-hour schedules queue the longest.
    # In practice GitHub starts these hours late; see the note above.
    - cron: '3 12 * * *'
    - cron: '3 13 * * *'
    - cron: '3 20 * * *'
    - cron: '3 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Needed by the keepalive step below.
  actions: write

jobs:
  daily-check:
    # Pinned ahead of GitHub moving ubuntu-latest to 26.04 (Oct 19 - Nov 19 2026).
    runs-on: ubuntu-26.04
    # The check takes ~30 s; do not let a stuck runner hold a slot for hours.
    timeout-minutes: 10
    steps:
      - name: Decide whether this trigger matches 8 AM or 4 PM Eastern
        id: guard
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          zone=$(TZ=America/New_York date +%Z)   # EDT or EST
          case "$zone|$SCHEDULE" in
            "EDT|3 12 * * *"|"EDT|3 20 * * *"|"EST|3 13 * * *"|"EST|3 21 * * *")
              echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Skipping: schedule '$SCHEDULE' is not 8 AM or 4 PM in zone $zone"
              echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # GitHub switches off scheduled workflows in public repositories after 60
      # days without a push; scheduled runs do not count. Re-enabling the
      # workflow resets that clock, so this backup cannot silently stop.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable daily-check.yml

      - name: Checkout repo
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm install

      - name: Run daily check
        if: steps.guard.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # No Twilio credentials here on purpose: calling Twilio from GitHub's
          # rotating runner IPs trips Twilio's fraud lock. See daily-check.js.
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          MONITOR_HEALTH_URL: ${{ secrets.MONITOR_HEALTH_URL }}
          MONITOR_EMAIL_TO: ${{ secrets.MONITOR_EMAIL_TO }}
          # Scheduled runs are silent when healthy; manual runs always email.
          MONITOR_EMAIL_ONLY_ON_FAILURE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SHEET_NAME }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TRANSFER_PHONE_NUMBER: ${{ secrets.TRANSFER_PHONE_NUMBER }}
        run: node src/monitor/daily-check.js
